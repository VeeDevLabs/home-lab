version: "3.9"

services:

  # ===============================
  # MySQL Database
  # ===============================
  mysql:
    image: mysql:8
    container_name: lab-mysql
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lab-network


  # ===============================
  # Backend API
  # ===============================
  app:
    build:
      context: ./docker-lab-phase2/app
      dockerfile: Dockerfile
    container_name: lab-app
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    expose:
      - "3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_DATABASE: appdb
    depends_on:
      - mysql
    networks:
      - lab-network


  # ===============================
  # Estate UI (Frontend)
  # ===============================
  estate-ui:
    build:
      context: ./estate-ui
      dockerfile: dockerfile
    container_name: estate-ui
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    expose:
      - "80"
    networks:
      - lab-network


  # ===============================
  # Reverse Proxy
  # ===============================
  lab-nginx:
    image: nginx:latest
    container_name: lab-nginx
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "8081:80"
    volumes:
      - ./docker-lab-phase2/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - estate-ui
    networks:
      - lab-network


  # ===============================
  # Prometheus
  # ===============================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "9090:9090"
    networks:
      - lab-network


  # ===============================
  # Grafana
  # ===============================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "3001:3000"
    networks:
      - lab-network


  # ===============================
  # cAdvisor (Container Metrics)
  # ===============================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - lab-network


  # ===============================
  # Node Exporter (Host Metrics)
  # ===============================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "9100:9100"
    networks:
      - lab-network


# ===============================
# Networks
# ===============================
networks:
  lab-network:
    driver: bridge


# ===============================
# Volumes
# ===============================
volumes:
  mysql_data: